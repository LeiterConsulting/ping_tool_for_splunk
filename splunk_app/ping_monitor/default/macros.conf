# ============================================================================
# Ping Monitor - Search Macros
# ============================================================================
# These macros read configuration from ping_monitor.conf
# ============================================================================

# ----------------------------------------------------------------------------
# Core ping data access
# ----------------------------------------------------------------------------
# Splunk Cloud users often don't have REST capabilities, and the app's
# configuration is managed via KV Store (Setup dashboard). Avoid `rest` usage.

# Default event source. Use ping_events(index, sourcetype) explicitly when
# searching a non-default historical event location. Reports use metrics and
# the Setup-driven ping_metrics_filter, avoiding dynamic event subsearches.
[ping_events]
definition = `ping_events(ping, ping_monitor)`

[ping_events(2)]
args = index, sourcetype
definition = | union [ search index=$index$ sourcetype=$sourcetype$ ]

[ping_summaries]
definition = `ping_events` | search record_type=summary

[ping_summaries(2)]
args = index, sourcetype
definition = `ping_events($index$, $sourcetype$)` | search record_type=summary

[ping_dev_summaries]
definition = `ping_events` | search record_type=summary_dev

[ping_dev_summaries(2)]
args = index, sourcetype
definition = `ping_events($index$, $sourcetype$)` | search record_type=summary_dev

[ping_inventory_events]
definition = `ping_events` | search (record_type=summary OR record_type=summary_dev OR record_type=monitoring_control)

[ping_inventory_events(2)]
args = index, sourcetype
definition = `ping_events($index$, $sourcetype$)` | search (record_type=summary OR record_type=summary_dev OR record_type=monitoring_control)

[ping_current_dev_targets]
definition = `ping_events` | search (record_type=summary OR record_type=summary_dev) \
    | stats latest(_time) as last_seen, latest(dev) as dev by target_ip \
    | eval current_dev=lower(tostring(dev)) \
    | where current_dev="true" OR current_dev="1" OR current_dev="t" \
    | fields target_ip

[ping_current_dev_targets(2)]
args = index, sourcetype
definition = `ping_events($index$, $sourcetype$)` | search (record_type=summary OR record_type=summary_dev) \
    | stats latest(_time) as last_seen, latest(dev) as dev by target_ip \
    | eval current_dev=lower(tostring(dev)) \
    | where current_dev="true" OR current_dev="1" OR current_dev="t" \
    | fields target_ip

[ping_current_dev_summaries]
definition = `ping_dev_summaries` \
    | search [ `ping_current_dev_targets` | format ]

[ping_current_dev_summaries(2)]
args = index, sourcetype
definition = `ping_dev_summaries($index$, $sourcetype$)` \
    | search [ `ping_current_dev_targets($index$, $sourcetype$)` | format ]

# ----------------------------------------------------------------------------
# Ping individual pings
# ----------------------------------------------------------------------------
[ping_details]
definition = `ping_events` | search record_type=ping

# Normalize mixed history and remove exact duplicate deliveries. Schema v2+
# health uses the collector's hysteretic state; v1 is explicitly marked as an
# inferred legacy state derived from packet loss.
[ping_normalize]
definition = eval schema_version=tonumber(coalesce(schema_version, 1)) \
    | eval measurement_valid=case(schema_version>=2 AND lower(tostring(measurement_valid)) IN ("true","1","t"), 1, schema_version>=2, 0, true(), 1) \
    | eval endpoint_id=coalesce(endpoint_id, target_ip), endpoint_key=coalesce(endpoint_id, target_ip) \
    | eval dedup_key=case(schema_version>=2, coalesce(event_id, md5(_raw)), record_type IN ("summary","summary_dev"), endpoint_key."|".record_type."|".strftime(_time, "%Y%m%d%H%M"), true(), coalesce(event_id, md5(_raw))) \
    | eval monitoring_enabled=if(lower(tostring(coalesce(monitoring_enabled, "true"))) IN ("true","1","t"), "true", "false") \
    | eval effective_state=case(record_type="monitoring_control", coalesce(state, if(monitoring_enabled="false", "disabled", "maintenance")), schema_version>=2, coalesce(state, "unknown"), packet_loss_pct==0, "up", packet_loss_pct>0 AND packet_loss_pct<100, "degraded", packet_loss_pct==100, "down", true(), "unknown") \
    | eval state_source=case(record_type="monitoring_control", "collector_policy", schema_version>=2, "collector", true(), "legacy_packet_loss_inference") \
    | eval state_confidence=coalesce(state_confidence, if(schema_version>=2, "unknown", "inferred")) \
    | eval stale_after_seconds=coalesce(stale_after_seconds, 120) \
    | eval observation_status=coalesce(observation_status, case(record_type="monitoring_control", "suppressed", measurement_valid=0, "probe_error", packet_loss_pct=0, "reply", packet_loss_pct=100, "no_reply", true(), "partial_reply")) \
    | eval signal_quality=case(observation_status="suppressed", "suppressed", measurement_valid=0, "invalid", state_confidence="pending", "provisional", state_source="legacy_packet_loss_inference", "inferred", true(), "valid") \
    | dedup dedup_key

[ping_apply_health_label]
definition = eval health_status=case(effective_state="up", "Healthy", effective_state="degraded", "Degraded", effective_state="down", "Down", effective_state="stale", "Stale", true(), "Unknown")

[ping_apply_status_label]
definition = eval status=case(effective_state="up", "Healthy", effective_state="degraded", "Degraded", effective_state="down", "Down", effective_state="stale", "Stale", true(), "Unknown")

[ping_apply_stale_state(2)]
args = last_seen, stale_after
definition = eval effective_state=if(now()-$last_seen$>coalesce($stale_after$, 120), "stale", effective_state)

# Map collector-emitted metric state codes. Packet-loss inference is retained
# only for pre-v3 metric history and is labeled through metric_state_source.
[ping_apply_metric_state]
definition = eval effective_state=case(isnotnull(state_code) AND state_code=1, "up", isnotnull(state_code) AND state_code=0.5, "degraded", isnotnull(state_code) AND state_code=0, "down", isnotnull(state_code), "unknown", packet_loss_pct=0, "up", packet_loss_pct>0 AND packet_loss_pct<100, "degraded", packet_loss_pct=100, "down", true(), "unknown") \
    | eval metric_state_source=if(isnotnull(state_code), "collector", "legacy_packet_loss_inference")

[ping_metrics_filter]
definition = [| inputlookup ping_monitor_settings_lookup \
    | search _key="global" \
    | head 1 \
    | eval found=1 \
    | append [| makeresults | eval found=0, metrics_index="ping_metrics"] \
    | sort - found \
    | head 1 \
    | eval index=coalesce(metrics_index, "ping_metrics") \
    | fields index \
    | format]

# ----------------------------------------------------------------------------
# Metrics queries
# ----------------------------------------------------------------------------
[ping_metrics(2)]
args = metrics_index, span
definition = | mstats avg(ping.avg_latency_ms) AS avg_latency_ms, \
    max(ping.max_latency_ms) AS max_latency_ms, \
    min(ping.min_latency_ms) AS min_latency_ms, \
    avg(ping.packet_loss_pct) AS packet_loss_pct, \
    latest(ping.state_code) AS state_code, \
    latest(ping.observation_code) AS observation_code, \
    latest(ping.state_confidence) AS state_confidence, \
    latest(ping.stale_after_seconds) AS stale_after_seconds, \
    sum(ping.pings_sent) AS pings_sent, \
    sum(ping.pings_successful) AS pings_successful \
    WHERE index=$metrics_index$ span=$span$ \
    BY hostname, target_ip, group, description, entitytype, device, vendor, additional_notes

[ping_metrics]
definition = `ping_metrics(ping_metrics, 1m)`

# ----------------------------------------------------------------------------
# Union of events and metrics
# ----------------------------------------------------------------------------
[ping_data_union(4)]
args = events_index, sourcetype, metrics_index, span
definition = `ping_summaries($events_index$, $sourcetype$)` \
    | `ping_normalize` \
    | eval data_source="events" \
    | fields _time, hostname, target_ip, group, description, entitytype, device, vendor, additional_notes, \
             avg_latency_ms, min_latency_ms, max_latency_ms, packet_loss_pct, effective_state, observation_status, state_confidence, signal_quality, state_source, stale_after_seconds, pings_sent, pings_successful, data_source \
    | append [ \
        `ping_metrics($metrics_index$, $span$)` \
        | eval data_source="metrics" \
        | fields _time, hostname, target_ip, group, description, entitytype, device, vendor, additional_notes, \
                 avg_latency_ms, min_latency_ms, max_latency_ms, packet_loss_pct, state_code, observation_code, state_confidence, stale_after_seconds, pings_sent, pings_successful, data_source \
    ]

[ping_data_union]
definition = `ping_data_union(ping, ping_monitor, ping_metrics, 1m)`

# ----------------------------------------------------------------------------
# Asset inventory from ping data
# ----------------------------------------------------------------------------
[ping_asset_inventory]
definition = `ping_summaries` \
	| `ping_normalize` \
    | stats latest(_time) AS last_seen, \
            latest(avg_latency_ms) AS last_latency, \
            latest(packet_loss_pct) AS last_loss, \
			latest(effective_state) AS effective_state, \
			latest(observation_status) AS observation_status, \
			latest(state_confidence) AS state_confidence, \
			latest(signal_quality) AS signal_quality, \
			latest(stale_after_seconds) AS stale_after_seconds, \
            avg(packet_loss_pct) AS avg_loss, \
            avg(avg_latency_ms) AS avg_latency, \
            values(group) AS groups, \
            values(description) AS description, \
            values(entitytype) AS entitytype, \
            values(device) AS device, \
            values(vendor) AS vendor \
        BY hostname, target_ip \
	| `ping_apply_stale_state(last_seen, stale_after_seconds)` \
	| `ping_apply_health_label` \
    | eval last_seen_human=strftime(last_seen, "%Y-%m-%d %H:%M:%S")

[ping_cmdb_inventory]
definition = `ping_cmdb_inventory(ping, ping_monitor)`

[ping_cmdb_inventory(2)]
args = index, sourcetype
definition = `ping_inventory_events($index$, $sourcetype$)` \
    | `ping_normalize` \
    | stats earliest(_time) AS first_seen, latest(_time) AS last_seen, \
            latest(hostname) AS hostname, latest(fqdn) AS fqdn, latest(target_ip) AS target_ip, \
            latest(group) AS group, latest(description) AS description, latest(entitytype) AS entitytype, \
            latest(device) AS device, latest(vendor) AS vendor, latest(additional_notes) AS additional_notes, \
            latest(dev) AS dev, latest(monitoring_enabled) AS monitoring_enabled, \
            latest(maintenance_until) AS maintenance_until, latest(maintenance_reason) AS maintenance_reason, \
            latest(effective_state) AS effective_state, latest(observation_status) AS observation_status, \
            latest(state_confidence) AS state_confidence, latest(signal_quality) AS signal_quality, \
            latest(stale_after_seconds) AS stale_after_seconds, latest(avg_latency_ms) AS last_latency_ms, \
            latest(packet_loss_pct) AS last_packet_loss_pct \
        BY endpoint_key \
    | eval monitoring_status=case(monitoring_enabled="false", "Paused", effective_state="maintenance", "Maintenance", true(), "Active") \
    | eval effective_state=if(monitoring_status="Active" AND now()-last_seen>coalesce(stale_after_seconds,120), "stale", effective_state) \
    | eval inventory_state=case(monitoring_status="Paused", "Paused", monitoring_status="Maintenance", "Maintenance", effective_state="up", "Healthy", effective_state="degraded", "Degraded", effective_state="down", "Down", effective_state="stale", "Stale", true(), "Unknown") \
    | eval first_seen_human=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen_human=strftime(last_seen, "%Y-%m-%d %H:%M:%S")

# ----------------------------------------------------------------------------
# Helper macros
# ----------------------------------------------------------------------------
[ping_latest_status]
definition = `ping_summaries` | where _time>=relative_time(now(), "-15m") | `ping_normalize` | stats latest(*) AS * by endpoint_key

[ping_endpoints_with_issues]
definition = `ping_summaries` \
	| where _time>=relative_time(now(), "-1h") \
	| `ping_normalize` \
    | stats avg(packet_loss_pct) AS avg_loss by hostname, target_ip \
    | where avg_loss > 0 \
    | sort -avg_loss

[ping_availability_trend(1)]
args = span
definition = `ping_summaries` \
	| `ping_normalize` \
    | timechart span=$span$ avg(eval(100-packet_loss_pct)) AS availability

[ping_latency_trend(1)]
args = span
definition = `ping_summaries` \
	| `ping_normalize` \
    | timechart span=$span$ avg(avg_latency_ms) AS avg_latency by hostname
