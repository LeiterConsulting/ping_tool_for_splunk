# Ping Monitor Lookup Definitions

[ping_monitor_settings_lookup]
collection = ping_monitor_settings
external_type = kvstore
fields_list = _key, index, sourcetype, metrics_index, configured

[ping_health_lookup]
collection = ping_health_lookup
external_type = kvstore
fields_list = hostname, target_ip, group, entitytype, health_status, effective_state, observation_status, state_confidence, signal_quality, state_source, freshness_source, latency_observation_valid, packet_loss_pct, avg_latency_ms, last_seen_epoch, stale_after_seconds, last_updated
