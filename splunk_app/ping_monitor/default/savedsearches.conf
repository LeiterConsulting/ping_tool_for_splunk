| appendpipe [ \
    stats count \
    | where count=0 \
    | eval hostname="Health lookup is empty", target_ip="", group="", entitytype="", health_status="", observation_status="", signal_quality="", freshness_source="", packet_loss_pct="", avg_latency_ms="", last_updated="" \
    | table hostname, target_ip, group, entitytype, health_status, observation_status, signal_quality, freshness_source, packet_loss_pct, avg_latency_ms, last_updated \
] \
| rename target_ip as "IP Address" health_status as "Health Status" observation_status as "Latest Observation" signal_quality as "Signal Quality" freshness_source as "Freshness Source" packet_loss_pct as "Packet Loss %" avg_latency_ms as "Average Latency (ms)" last_updated as "Last Updated"
