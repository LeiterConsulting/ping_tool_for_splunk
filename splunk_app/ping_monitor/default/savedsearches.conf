# ============================================================================
# Ping Monitor Saved Searches
# ============================================================================
# These searches use the KV Store settings configured in the Setup page.
# They load configuration from ping_monitor_settings_lookup and use subsearch
# to dynamically get the correct index and sourcetype.
# ============================================================================

# Note: For scheduled searches, we use a pattern where we:
# 1. Load config from KV Store lookup
# 2. Use a subsearch (format) to inject configured values
# 3. Fall back to defaults if not configured

# ============================================================================
# Scheduled search to populate health lookup for correlation
# ============================================================================
[Ping Monitor - Update Health Lookup]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = * * * * *
description = Updates the ping_health_lookup table every minute with coherent current collector state from the configured metrics index.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.packet_loss_pct") as packet_loss_pct, \
        latest("ping.avg_latency_ms") as avg_latency_ms, \
        latest("ping.state_code") as state_code, \
        latest("ping.observation_code") as observation_code, \
        latest("ping.state_confidence") as confidence_code, \
        latest("ping.stale_after_seconds") as stale_after_seconds, \
        latest("ping.observed_at_epoch") as observed_at_epoch, \
        latest("ping.measurement_valid") as measurement_valid, \
        latest("ping.pings_successful") as pings_successful \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group, entitytype span=5m \
| stats latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, latest(packet_loss_pct) as packet_loss_pct, \
        latest(avg_latency_ms) as avg_latency_ms, latest(state_code) as state_code, \
        latest(observation_code) as observation_code, latest(confidence_code) as confidence_code, \
        latest(measurement_valid) as measurement_valid, latest(pings_successful) as pings_successful, \
        latest(stale_after_seconds) as stale_after_seconds, latest(group) as group, \
        latest(entitytype) as entitytype by hostname, target_ip \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_apply_metric_state` \
| `ping_enforce_observation_coherence` \
| `ping_apply_stale_state(last_seen, stale_after_seconds)` \
| `ping_apply_health_label` \
| eval observation_status=case(observation_code=1,"reply", observation_code=0.5,"partial_reply", observation_code=0,"no_reply", true(),"probe_error") \
| eval state_confidence=case(confidence_code=1,"confirmed", confidence_code=0.5,"pending", true(),"unknown") \
| eval signal_quality=case(effective_state="stale","stale", state_confidence="pending","provisional", state_confidence="unknown","invalid", freshness_source="legacy_bucket_upper_bound","legacy_time_bound", true(),"valid"), state_source=metric_state_source, last_seen_epoch=last_seen \
| eval last_updated=strftime(now(), "%Y-%m-%d %H:%M:%S") \
| fields hostname, target_ip, group, entitytype, health_status, effective_state, observation_status, state_confidence, signal_quality, state_source, freshness_source, latency_observation_valid, packet_loss_pct, avg_latency_ms, last_seen_epoch, stale_after_seconds, last_updated \
| outputlookup ping_health_lookup

# ============================================================================
# Alert: Endpoint Down (100% packet loss)
# ============================================================================
[Ping Monitor - Endpoint Down Alert]
action.email.useNSSubject = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = hostname
alert.suppress.period = 1h
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Alerts when the collector-confirmed current metric state is down and endpoint alerting is enabled.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 0
quantity = 0
relation = greater than
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.state_code") as state_code, latest("ping.stale_after_seconds") as stale_after_seconds, latest("ping.alerting_enabled") as alerting_enabled, latest("ping.observed_at_epoch") as observed_at_epoch \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group span=5m \
| stats latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, latest(state_code) as state_code, latest(stale_after_seconds) as stale_after_seconds, latest(alerting_enabled) as alerting_enabled, latest(group) as group by hostname, target_ip \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_apply_metric_state` \
| `ping_apply_stale_state(last_seen, stale_after_seconds)` \
| eval alerting_enabled=coalesce(alerting_enabled,1) \
| where alerting_enabled=1 AND effective_state="down" \
| eval last_seen_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table hostname, target_ip, group, last_seen_human \
| rename last_seen_human as "Last Seen"

# ============================================================================
# Alert: High Packet Loss (>25% but <100%)
# ============================================================================
[Ping Monitor - High Packet Loss Alert]
action.email.useNSSubject = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = hostname
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Alerts when an alert-eligible endpoint's latest valid metric observation has more than 25% but less than 100% packet loss.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 0
quantity = 0
relation = greater than
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.packet_loss_pct") as packet_loss, latest("ping.measurement_valid") as measurement_valid, latest("ping.alerting_enabled") as alerting_enabled, latest("ping.observed_at_epoch") as observed_at_epoch, latest("ping.stale_after_seconds") as stale_after_seconds \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group span=5m \
| stats latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, latest(packet_loss) as packet_loss, latest(measurement_valid) as measurement_valid, latest(stale_after_seconds) as stale_after_seconds, latest(alerting_enabled) as alerting_enabled, latest(group) as group by hostname, target_ip \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| eval alerting_enabled=coalesce(alerting_enabled,1) \
| where alerting_enabled=1 AND measurement_valid=1 AND now()-last_seen<=coalesce(stale_after_seconds,120) AND packet_loss>25 AND packet_loss<100 \
| eval last_seen_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| table hostname, target_ip, group, packet_loss, last_seen_human \
| rename packet_loss as "Packet Loss %" last_seen_human as "Last Seen"

# ============================================================================
# Alert: High Latency (>200ms)
# ============================================================================
[Ping Monitor - High Latency Alert]
action.email.useNSSubject = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = hostname
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Alerts when an alert-eligible endpoint's latest valid metric observation has average latency above 200ms.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 0
quantity = 0
relation = greater than
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.avg_latency_ms") as avg_latency_ms, latest("ping.packet_loss_pct") as packet_loss_pct, latest("ping.measurement_valid") as measurement_valid, latest("ping.observation_code") as observation_code, latest("ping.pings_successful") as pings_successful, latest("ping.alerting_enabled") as alerting_enabled, latest("ping.observed_at_epoch") as observed_at_epoch, latest("ping.stale_after_seconds") as stale_after_seconds \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group span=5m \
| stats latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, latest(avg_latency_ms) as avg_latency_ms, latest(packet_loss_pct) as packet_loss_pct, latest(measurement_valid) as measurement_valid, latest(observation_code) as observation_code, latest(pings_successful) as pings_successful, latest(stale_after_seconds) as stale_after_seconds, latest(alerting_enabled) as alerting_enabled, latest(group) as group by hostname, target_ip \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_enforce_observation_coherence` \
| eval alerting_enabled=coalesce(alerting_enabled,1) \
| where alerting_enabled=1 AND now()-last_seen<=coalesce(stale_after_seconds,120) AND isnotnull(avg_latency_ms) AND avg_latency_ms>200 \
| eval last_seen_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| eval latency = round(avg_latency_ms, 2) \
| table hostname, target_ip, group, latency, last_seen_human \
| rename latency as "Latency (ms)" last_seen_human as "Last Seen"

# ============================================================================
# Report: Daily Availability Summary
# ============================================================================
[Ping Monitor - Daily Availability Report]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = 0 8 * * *
description = Daily availability summary for all monitored endpoints using the configured metrics index.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.state_code") as state_code \
        WHERE `ping_metrics_filter` BY hostname, target_ip span=1h \
| stats latest(state_code) as state_code by hostname, target_ip \
| join type=left hostname, target_ip [ \
    | mstats latest("ping.state_code") as state_code \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group, entitytype span=1h \
    | stats latest(group) as group, latest(entitytype) as entitytype by hostname, target_ip \
] \
| join type=left hostname, target_ip [ \
    | mstats sum("ping.pings_successful") as success, sum("ping.pings_sent") as total, \
        max("ping.packet_loss_pct") as worst_packet_loss \
        WHERE `ping_metrics_filter` BY hostname, target_ip span=1h \
    | stats sum(success) as success, sum(total) as total, max(worst_packet_loss) as worst_packet_loss by hostname, target_ip \
] \
| join type=left hostname, target_ip [ \
    | mstats avg("ping.avg_latency_ms") as avg_latency_ms, max("ping.max_latency_ms") as max_latency_ms \
        WHERE `ping_metrics_filter` BY hostname, target_ip span=1h \
    | stats avg(avg_latency_ms) as avg_latency_ms, max(max_latency_ms) as max_latency_ms by hostname, target_ip \
] \
| eval success=coalesce(success,0), total=coalesce(total,0) \
| eval availability = if(total>0, round((success/total)*100, 2), null()) \
| eval avg_latency_ms = round(avg_latency_ms, 2) \
| eval max_latency_ms = round(max_latency_ms, 2) \
| eval worst_packet_loss = round(worst_packet_loss, 2) \
| eval status = case( \
    total=0, "Unknown - no valid samples", \
    availability >= 99.9, "Healthy", \
    availability >= 95, "Degraded", \
    availability >= 90, "Critical", \
    true(), "Down" \
) \
| sort -availability, hostname \
| table hostname, target_ip, group, entitytype, status, availability, avg_latency_ms, max_latency_ms, worst_packet_loss, total \
| appendpipe [ \
    stats count \
    | where count=0 \
    | eval hostname="No daily summary data found", target_ip="", group="", entitytype="", status="", availability="", avg_latency_ms="", max_latency_ms="", worst_packet_loss="", total="" \
    | table hostname, target_ip, group, entitytype, status, availability, avg_latency_ms, max_latency_ms, worst_packet_loss, total \
] \
| rename target_ip as "IP Address" status as "Status" availability as "Availability %" avg_latency_ms as "Average Latency (ms)" max_latency_ms as "Peak Latency (ms)" worst_packet_loss as "Worst Packet Loss %" total as "Samples"

# ============================================================================
# Report: Weekly Trend Report
# ============================================================================
[Ping Monitor - Weekly Trend Report]
action.email.useNSSubject = 1
alert.track = 0
cron_schedule = 0 9 * * 1
description = Seven-day fleet trend summary for availability, latency, and issue volume based on the configured metrics index.
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats sum("ping.pings_successful") as success, sum("ping.pings_sent") as total, \
        avg("ping.avg_latency_ms") as avg_latency_ms, avg("ping.packet_loss_pct") as packet_loss_pct \
        WHERE `ping_metrics_filter` BY hostname span=1d \
| stats sum(success) as success, sum(total) as total, avg(avg_latency_ms) as avg_latency_ms, \
        dc(hostname) as active_hosts, count(eval(packet_loss_pct>0)) as degraded_samples, \
        count(eval(packet_loss_pct>=50)) as critical_samples by _time \
| where total > 0 \
| eval date = strftime(_time, "%Y-%m-%d") \
| eval availability = round((success/total)*100, 2) \
| eval avg_latency_ms = round(avg_latency_ms, 2) \
| sort date \
| table date, active_hosts, availability, avg_latency_ms, degraded_samples, critical_samples, total \
| appendpipe [ \
    stats count \
    | where count=0 \
    | eval date="No weekly trend data found", active_hosts="", availability="", avg_latency_ms="", degraded_samples="", critical_samples="", total="" \
    | table date, active_hosts, availability, avg_latency_ms, degraded_samples, critical_samples, total \
] \
| rename active_hosts as "Active Hosts" availability as "Availability %" avg_latency_ms as "Average Latency (ms)" degraded_samples as "Degraded Samples" critical_samples as "Critical Samples" total as "Samples"

# ============================================================================
# Report: Current Health Status (Quick View)
# ============================================================================
[Ping Monitor - Current Health Status]
action.email.useNSSubject = 1
alert.track = 0
description = Current endpoint health rollup based on collector-emitted metrics state.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.packet_loss_pct") as packet_loss_pct, latest("ping.avg_latency_ms") as avg_latency_ms, \
        latest("ping.state_code") as state_code, latest("ping.observation_code") as observation_code, \
        latest("ping.state_confidence") as confidence_code, latest("ping.stale_after_seconds") as stale_after_seconds, \
        latest("ping.observed_at_epoch") as observed_at_epoch, latest("ping.measurement_valid") as measurement_valid, \
        latest("ping.pings_successful") as pings_successful \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group, entitytype, device, vendor span=5m \
| stats latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, latest(packet_loss_pct) as packet_loss_pct, latest(avg_latency_ms) as avg_latency_ms, \
        latest(state_code) as state_code, latest(observation_code) as observation_code, \
        latest(confidence_code) as confidence_code, latest(stale_after_seconds) as stale_after_seconds, \
        latest(measurement_valid) as measurement_valid, latest(pings_successful) as pings_successful, \
        latest(group) as group, latest(entitytype) as entitytype, latest(device) as device, latest(vendor) as vendor \
        by hostname, target_ip \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_apply_metric_state` \
| `ping_enforce_observation_coherence` \
| `ping_apply_stale_state(last_seen, stale_after_seconds)` \
| `ping_apply_health_label` \
| eval state_confidence=case(confidence_code=1,"confirmed", confidence_code=0.5,"pending", true(),"unknown") \
| eval signal_quality=case(state_confidence="pending","provisional", state_confidence="unknown","invalid", true(),"valid") \
| eval packet_loss = round(packet_loss_pct, 2) \
| eval latency = if(isnull(avg_latency_ms), null(), round(avg_latency_ms, 2)) \
| eval last_check_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| sort health_status, hostname \
| table hostname, target_ip, health_status, observation_status, state_confidence, signal_quality, packet_loss, latency, group, entitytype, device, vendor, last_check_human \
| appendpipe [ \
    stats count \
    | where count=0 \
    | eval hostname="No current health data found", target_ip="", health_status="", observation_status="", state_confidence="", signal_quality="", packet_loss="", latency="", group="", entitytype="", device="", vendor="", last_check_human="" \
    | table hostname, target_ip, health_status, observation_status, state_confidence, signal_quality, packet_loss, latency, group, entitytype, device, vendor, last_check_human \
] \
| rename target_ip as "IP Address" health_status as "Health Status" observation_status as "Latest Observation" state_confidence as "State Confidence" signal_quality as "Signal Quality" packet_loss as "Packet Loss %" latency as "Latency (ms)" last_check_human as "Last Check"

# ============================================================================
# Report: Metrics Summary (for Metrics index)
# ============================================================================
[Ping Monitor - Metrics Summary]
action.email.useNSSubject = 1
alert.track = 0
description = Current metrics-based status summary using the configured metrics index.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.packet_loss_pct") as packet_loss, \
    latest("ping.state_code") as state_code, \
    latest("ping.stale_after_seconds") as stale_after_seconds, \
    latest("ping.avg_latency_ms") as avg_latency_ms, \
    avg("ping.avg_latency_ms") as period_avg_latency_ms, \
    max("ping.max_latency_ms") as period_max_latency_ms, \
    sum("ping.pings_successful") as success, \
    sum("ping.pings_sent") as total, \
    latest("ping.pings_successful") as pings_successful, \
    latest("ping.measurement_valid") as measurement_valid, \
    latest("ping.observation_code") as observation_code, \
    latest("ping.observed_at_epoch") as observed_at_epoch \
    WHERE `ping_metrics_filter` BY hostname, target_ip, group span=5m \
| stats latest(packet_loss) as packet_loss, \
        latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, \
        latest(state_code) as state_code, \
        latest(stale_after_seconds) as stale_after_seconds, \
        latest(avg_latency_ms) as avg_latency_ms, \
        avg(period_avg_latency_ms) as period_avg_latency_ms, \
        max(period_max_latency_ms) as period_max_latency_ms, \
        latest(pings_successful) as pings_successful, latest(measurement_valid) as measurement_valid, latest(observation_code) as observation_code, \
        sum(success) as success, \
        sum(total) as total \
        by hostname, target_ip, group \
| where total > 0 \
| eval packet_loss_pct=packet_loss \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_enforce_observation_coherence` \
| eval availability = round((success/total)*100, 2) \
| eval current_latency_ms = if(isnull(avg_latency_ms),null(),round(avg_latency_ms, 2)) \
| eval avg_latency_ms = round(period_avg_latency_ms, 2) \
| eval max_latency_ms = round(period_max_latency_ms, 2) \
| eval packet_loss = round(packet_loss, 2) \
| `ping_apply_metric_state` \
| `ping_apply_stale_state(last_seen, stale_after_seconds)` \
| `ping_apply_health_label` \
| sort health_status, hostname \
| table hostname, target_ip, group, health_status, metric_state_source, availability, packet_loss, current_latency_ms, avg_latency_ms, max_latency_ms \
| appendpipe [ \
    stats count \
    | where count=0 \
    | eval hostname="No metrics summary data found", target_ip="", group="", health_status="", metric_state_source="", availability="", packet_loss="", current_latency_ms="", avg_latency_ms="", max_latency_ms="" \
    | table hostname, target_ip, group, health_status, metric_state_source, availability, packet_loss, current_latency_ms, avg_latency_ms, max_latency_ms \
] \
| rename target_ip as "IP Address" health_status as "Health Status" metric_state_source as "State Source" availability as "Availability %" packet_loss as "Packet Loss %" current_latency_ms as "Current Latency (ms)" avg_latency_ms as "Average Latency (ms)" max_latency_ms as "Peak Latency (ms)"

