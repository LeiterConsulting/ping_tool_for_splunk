        latest(observation_code) as observation_code, latest(pings_successful) as pings_successful, latest(stale_after_seconds) as stale_after_seconds, \
        latest(group) as group, latest(entitytype) as entitytype by hostname, target_ip \
| eval packet_loss_pct=current_loss \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_enforce_observation_coherence` \
| where measurement_valid=1 AND now()-last_seen<=coalesce(stale_after_seconds,120) \
| where current_loss >= 25 AND current_loss < 100 \
| eval current_loss = round(current_loss, 2) \
| eval average_loss = round(average_loss, 2) \
| eval avg_latency_ms = round(avg_latency_ms, 2) \
| eval last_seen_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| sort -current_loss, hostname \
| table hostname, target_ip, group, entitytype, current_loss, average_loss, avg_latency_ms, last_seen_human \
| appendpipe [ \
    stats count \
    | where count=0 \
    | eval hostname="No endpoints currently above the packet loss threshold", target_ip="", group="", entitytype="", current_loss="", average_loss="", avg_latency_ms="", last_seen_human="" \
    | table hostname, target_ip, group, entitytype, current_loss, average_loss, avg_latency_ms, last_seen_human \
] \
| rename target_ip as "IP Address" current_loss as "Current Loss %" average_loss as "Average Loss %" avg_latency_ms as "Average Latency (ms)" last_seen_human as "Last Seen"

# ============================================================================
# Report: Review endpoints with high latency
# ============================================================================
[Ping Monitor - High Latency Review]
action.email.useNSSubject = 1
alert.track = 0
description = Operator-facing review of endpoints with elevated latency in their latest valid metric observation.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | mstats latest("ping.avg_latency_ms") as avg_latency_ms, avg("ping.avg_latency_ms") as average_latency_ms, \
        latest("ping.packet_loss_pct") as packet_loss_pct, latest("ping.measurement_valid") as measurement_valid, \
        latest("ping.observation_code") as observation_code, latest("ping.pings_successful") as pings_successful, \
        latest("ping.observed_at_epoch") as observed_at_epoch, latest("ping.stale_after_seconds") as stale_after_seconds \
        WHERE `ping_metrics_filter` BY hostname, target_ip, group, entitytype span=5m \
| stats latest(_time) as bucket_time, latest(observed_at_epoch) as observed_at_epoch, latest(avg_latency_ms) as avg_latency_ms, \
        avg(average_latency_ms) as average_latency_ms, latest(packet_loss_pct) as packet_loss_pct, \
        latest(measurement_valid) as measurement_valid, latest(observation_code) as observation_code, latest(pings_successful) as pings_successful, latest(stale_after_seconds) as stale_after_seconds, latest(group) as group, \
        latest(entitytype) as entitytype by hostname, target_ip \
| `ping_metric_freshness(bucket_time, observed_at_epoch)` \
| `ping_enforce_observation_coherence` \
| where now()-last_seen<=coalesce(stale_after_seconds,120) AND isnotnull(avg_latency_ms) \
| where avg_latency_ms >= 200 \
| eval current_latency_ms = round(avg_latency_ms, 2) \
| eval average_latency_ms = round(average_latency_ms, 2) \
| eval packet_loss = round(packet_loss_pct, 2) \
| eval last_seen_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| sort -current_latency_ms, hostname \
| table hostname, target_ip, group, entitytype, current_latency_ms, average_latency_ms, packet_loss, last_seen_human \
| appendpipe [ \
    stats count \
    | where count=0 \
    | eval hostname="No endpoints currently above the latency threshold", target_ip="", group="", entitytype="", current_latency_ms="", average_latency_ms="", packet_loss="", last_seen_human="" \
    | table hostname, target_ip, group, entitytype, current_latency_ms, average_latency_ms, packet_loss, last_seen_human \
] \
| rename target_ip as "IP Address" current_latency_ms as "Current Latency (ms)" average_latency_ms as "Average Latency (ms)" packet_loss as "Packet Loss %" last_seen_human as "Last Seen"

# ============================================================================
# Report: Current health lookup contents
# ============================================================================
[Ping Monitor - Health Lookup Status]
action.email.useNSSubject = 1
alert.track = 0
description = Current contents of the ping_health_lookup KV Store collection used by the correlation dashboard.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_app = ping_monitor
request.ui_dispatch_view = search
search = | inputlookup ping_health_lookup \
| eval packet_loss_pct = round(packet_loss_pct, 2) \
| eval avg_latency_ms = round(avg_latency_ms, 2) \
| sort health_status, hostname \
